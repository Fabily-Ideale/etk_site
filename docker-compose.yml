services:
  etk_site:
    container_name: etk_site
    build: .
    restart: unless-stopped
    mem_limit: 32m
    pids_limit: 100
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - etk_rede

  cloudflared_site:
    image: cloudflare/cloudflared:2026.9.3
    container_name: cloudflared_site
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_SITE_TOKEN}
    pids_limit: 100
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - etk_rede

networks:
  etk_rede:
    external: true
