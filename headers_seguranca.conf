add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://chatwoot.etotek.com.br; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://chatwoot.etotek.com.br; connect-src 'self' https://chatwoot.etotek.com.br wss://chatwoot.etotek.com.br; frame-src https://chatwoot.etotek.com.br; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
