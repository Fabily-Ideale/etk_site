server_tokens off;

proxy_cache_path /tmp/cache_servicos levels=1:2 keys_zone=cache_servicos:1m max_size=1m inactive=1h use_temp_path=off;
set_real_ip_from 172.20.0.0/16;
real_ip_header CF-Connecting-IP;

limit_req_zone $binary_remote_addr zone=limite_servicos:1m rate=10r/s;

gzip on;
gzip_min_length 256;
gzip_comp_level 5;
gzip_vary on;
gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/xml application/xml text/plain;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/headers_seguranca.conf;

    absolute_redirect off;
    error_page 404 /404.html;

    if ($request_uri ~ "^/index\.html(\?.*)?$") {
        return 301 /$is_args$args;
    }

    location = /servicos.json {
        limit_except GET HEAD {
            deny all;
        }

        set $upstream_servicos http://agente.local:3001/publico/servicos.json;

        limit_req zone=limite_servicos burst=20 nodelay;

        proxy_pass $upstream_servicos;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host agente.local;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Content-Type;

        include /etc/nginx/headers_seguranca.conf;
        add_header Content-Type "application/json; charset=utf-8" always;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;

        proxy_cache cache_servicos;
        proxy_cache_valid 200 5m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    }

    location ~ /\. {
        deny all;
    }

    location /assets/ {
        limit_except GET HEAD {
            deny all;
        }

        include /etc/nginx/headers_seguranca.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location ~ ^/(css|js)/ {
        limit_except GET HEAD {
            deny all;
        }

        expires 1h;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 1d;
    }

    location = /404.html {
        internal;
        expires -1;
    }

    location / {
        limit_except GET HEAD {
            deny all;
        }

        try_files $uri $uri/ =404;
        expires -1;
    }
}
