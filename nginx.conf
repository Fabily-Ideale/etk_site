server_tokens off;

proxy_cache_path /tmp/cache_servicos levels=1:2 keys_zone=cache_servicos:1m max_size=1m inactive=1h use_temp_path=off;
limit_req_zone $binary_remote_addr zone=limite_servicos:1m rate=10r/s;

gzip on;
gzip_min_length 256;
gzip_comp_level 5;
gzip_types text/css application/javascript application/json image/svg+xml;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://chatwoot.etotek.com.br; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://chatwoot.etotek.com.br; connect-src 'self' https://chatwoot.etotek.com.br wss://chatwoot.etotek.com.br; frame-src https://chatwoot.etotek.com.br; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /servicos.json {
        limit_except GET HEAD {
            deny all;
        }

        set $upstream_servicos http://agente.local:3001/publico/servicos.json;

        limit_req zone=limite_servicos burst=20 nodelay;

        proxy_pass $upstream_servicos;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host agente.local;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;

        proxy_cache cache_servicos;
        proxy_cache_valid 200 5m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    }

    location ~ /\. {
        deny all;
    }

    location /assets/ {
        limit_except GET HEAD {
            deny all;
        }

        expires 30d;
    }

    location ~ ^/(css|js)/ {
        limit_except GET HEAD {
            deny all;
        }

        expires 1h;
    }

    location / {
        limit_except GET HEAD {
            deny all;
        }

        try_files $uri $uri/ =404;
        expires -1;
    }
}
